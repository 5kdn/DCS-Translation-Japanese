# ------------------------------------------------------------
# Purpose:
#   - 依存の自動更新（セキュリティ & 定期）
# ------------------------------------------------------------
version: 2

updates:

# ─────────────────────────────────────────────────────────
# 1) GitHub Actions のアクション更新を監視
# ─────────────────────────────────────────────────────────
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
    time: "03:20"
    timezone: "Asia/Tokyo"
  target-branch: "master"
  labels:
    - "dependencies"
    - "ci"
  commit-message:
    prefix: "chore"
    include: "scope"
